# One origin for the whole app, the same split vercel.json and vite.config.js make:
# /api/ai/* to the gateway, other /api/* to the Node functions, the rest to the
# front end. The longest matching prefix wins.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alapana
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api/ai
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  name: http
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
