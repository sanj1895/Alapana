# Serves the built front end inside the web container (Dockerfile.web).
# The Ingress sends /api/* to the API and gateway, so nginx only sees static paths.
server {
    listen 8080;
    root /usr/share/nginx/html;

    # Kubernetes probes.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite fingerprints everything in /assets, so it can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
