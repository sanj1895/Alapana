# Helm values for Traefik, the Ingress controller on the local kind cluster.
#   helm install traefik traefik/traefik --version 42.3.1 -n traefik --create-namespace -f deploy/values/traefik.yaml
#
# kind forwards localhost:80 to node port 30080 (deploy/kind-config.yaml).
# Traefik replaces ingress-nginx, which was retired in March 2026.
service:
  spec:
    type: NodePort
ports:
  web:
    nodePort: 30080
ingressClass:
  enabled: true
  isDefaultClass: true
# Argo CD reports an Ingress as Progressing until its status has an address.
# A NodePort Service has no address to copy, so publish the one kind forwards
# from instead.
providers:
  kubernetesIngress:
    publishedService:
      enabled: false
    ingressEndpoint:
      ip: 127.0.0.1
